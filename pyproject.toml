    "langchain>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.6.0",
    "linkup-sdk>=0.2.4",
    "mcp[cli]>=1.6.0",
]
